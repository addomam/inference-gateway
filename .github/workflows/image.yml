name: image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Pull requests run only the smoke job, whose token can read the repository.
# Main and manual runs repeat that smoke test and upload infer-local.tar.
# actions: write is only on the archive job, for that upload.
permissions:
  contents: read

jobs:
  smoke:
    name: kind smoke
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install kind and kubectl
        run: |
          curl -fsSL -o /tmp/kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          install -m 0755 /tmp/kind /usr/local/bin/kind
          curl -fsSL -o /tmp/kubectl https://dl.k8s.io/release/v1.32.2/bin/linux/amd64/kubectl
          install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          kind version
          kubectl version --client
      - name: Build the image and smoke-test it
        run: bash deploy/e2e/smoke.sh

  archive:
    name: kind smoke and archive
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install kind and kubectl
        run: |
          curl -fsSL -o /tmp/kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          install -m 0755 /tmp/kind /usr/local/bin/kind
          curl -fsSL -o /tmp/kubectl https://dl.k8s.io/release/v1.32.2/bin/linux/amd64/kubectl
          install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          kind version
          kubectl version --client
      - name: Build the image and smoke-test it
        run: bash deploy/e2e/smoke.sh
      - name: Save the smoke-tested image
        env:
          IMAGE_TAR: ${{ runner.temp }}/infer-local.tar
        run: docker save -o "$IMAGE_TAR" infer:local
      - name: Upload the smoke-tested image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: infer-local
          path: ${{ runner.temp }}/infer-local.tar
          if-no-files-found: error
          retention-days: 1
          overwrite: true
