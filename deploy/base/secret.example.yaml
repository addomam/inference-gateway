# Example only. This file is not applied by Kustomize.
# Create the secret out of band and do not commit real values:
#
#   kubectl -n infer create secret generic infer-credentials \
#     --from-literal=proxy-token="$(openssl rand -hex 32)" \
#     --from-literal=control-token="$(openssl rand -hex 32)" \
#     --from-literal=upstream-token='replace-with-the-provider-credential'
#
# The two gateway tokens must differ and each must be at least 16 visible
# ASCII characters with no whitespace. upstream-token is required when the
# configured provider auth mode is api_key or bearer.
apiVersion: v1
kind: Secret
metadata:
  name: infer-credentials
  namespace: infer
type: Opaque
stringData:
  proxy-token: replace-with-at-least-16-visible-ascii-characters
  control-token: replace-with-a-different-16-plus-character-token
  upstream-token: replace-with-the-provider-credential
