apiVersion: apps/v1
kind: Deployment
metadata:
  name: stub
  labels:
    app.kubernetes.io/name: infer
    app.kubernetes.io/component: stub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: infer
      app.kubernetes.io/component: stub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: infer
        app.kubernetes.io/component: stub
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stub
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "/script/stub.py"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: script
              mountPath: /script
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: stub-script
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: stub
  labels:
    app.kubernetes.io/name: infer
    app.kubernetes.io/component: stub
spec:
  selector:
    app.kubernetes.io/name: infer
    app.kubernetes.io/component: stub
  ports:
    - name: http
      port: 8080
      targetPort: http
